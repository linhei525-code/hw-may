<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日運氣扭蛋機</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DotGothic16', 'Noto Sans TC', sans-serif;
      image-rendering: pixelated;
    }

    body {
      background-color: #2b2b36;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 24px;
      color: #ffd166;
      text-shadow: 3px 3px 0 #000;
      letter-spacing: 2px;
    }

    /* 扭蛋機外框 */
    .gacha-machine {
      position: relative;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 頂蓋 */
    .machine-top {
      width: 190px;
      height: 20px;
      background: #ef476f;
      border: 4px solid #000;
      border-bottom: none;
      box-shadow: inset 4px 4px 0 #ff7597;
    }

    /* 透明蛋罩 */
    .machine-globe {
      position: relative;
      width: 220px;
      height: 190px;
      background: #d8f3dc;
      border: 4px solid #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset -8px -8px 0 #b7e4c7;
    }

    /* 內部擺設的靜態蛋 */
    .egg-display {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 3px solid #000;
      border-radius: 50%;
      overflow: hidden;
    }
    .egg-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: inherit;
    }
    .egg-display::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: #fff;
      border-top: 2px solid #000;
    }
    .egg-1 { top: 70px; left: 35px; background: #ff595e; transform: rotate(-15deg); }
    .egg-2 { top: 90px; left: 85px; background: #ffca3a; transform: rotate(10deg); }
    .egg-3 { top: 75px; right: 35px; background: #1982c4; transform: rotate(30deg); }
    .egg-4 { top: 125px; left: 55px; background: #8ac926; transform: rotate(-25deg); }
    .egg-5 { top: 120px; right: 60px; background: #6a4c93; transform: rotate(15deg); }

    /* 機身底座 */
    .machine-base {
      width: 240px;
      height: 180px;
      background: #ef476f;
      border: 4px solid #000;
      border-top: none;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 6px 6px 0 #ff7597, inset -6px 0 0 #b32042;
    }

    /* 旋鈕面板 */
    .crank-box {
      width: 60px;
      height: 60px;
      background: #e0e0e0;
      border: 4px solid #000;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .crank-handle {
      width: 14px;
      height: 38px;
      background: #ffca3a;
      border: 3px solid #000;
      position: relative;
      transition: transform 0.6s ease;
    }

    .crank-handle::after {
      content: '';
      position: absolute;
      width: 38px;
      height: 14px;
      background: #ffca3a;
      border: 3px solid #000;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 出蛋口 */
    .machine-exit {
      width: 70px;
      height: 48px;
      background: #1a1a24;
      border: 4px solid #000;
      margin-top: 20px;
      position: relative;
      overflow: visible;
    }

    /* 掉落的扭蛋 */
    .dropped-egg {
      position: absolute;
      width: 36px;
      height: 36px;
      border: 3px solid #000;
      border-radius: 50%;
      top: -45px;
      left: 14px;
      opacity: 0;
      overflow: hidden;
      z-index: 5;
    }
    .dropped-egg::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: #ff595e;
    }
    .dropped-egg::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: #fff;
      border-top: 2px solid #000;
    }

    /* 按鈕 */
    .spin-btn {
      margin-top: 26px;
      padding: 12px 28px;
      font-size: 18px;
      background: #ffd166;
      color: #000;
      border: 4px solid #000;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
      outline: none;
      transition: all 0.1s;
    }
    .spin-btn:hover:not(:disabled) {
      background: #ffe08a;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }
    .spin-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }
    .spin-btn:disabled {
      background: #8d99ae;
      cursor: not-allowed;
      box-shadow: 2px 2px 0 #000;
      transform: none;
      color: #495057;
    }

    /* 彈出結果視窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 10;
    }

    .modal-card {
      background: #fff;
      border: 5px solid #000;
      box-shadow: 8px 8px 0 #000;
      width: 100%;
      max-width: 340px;
      padding: 24px 20px;
      text-align: center;
      color: #2b2b36;
      position: relative;
      animation: popIn 0.25s ease-out;
    }

    .result-rank {
      font-size: 32px;
      color: #ef476f;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .result-text {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 20px;
    }

    .close-btn {
      padding: 8px 22px;
      background: #06d6a0;
      border: 3px solid #000;
      box-shadow: 3px 3px 0 #000;
      cursor: pointer;
      font-size: 15px;
    }
    .close-btn:hover {
      background: #20e3b1;
    }

    /* 動畫 */
    @keyframes shake {
      0% { transform: translate(1px, 1px) rotate(0deg); }
      20% { transform: translate(-2px, -1px) rotate(-1deg); }
      40% { transform: translate(2px, 1px) rotate(1deg); }
      60% { transform: translate(-1px, -1px) rotate(0deg); }
      80% { transform: translate(2px, 1px) rotate(1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    @keyframes drop {
      0% { top: -30px; opacity: 1; transform: translateY(0) rotate(0deg); }
      70% { top: 12px; opacity: 1; transform: translateY(0) rotate(120deg); }
      85% { top: 6px; opacity: 1; transform: translateY(0) rotate(140deg); }
      100% { top: 10px; opacity: 1; transform: translateY(0) rotate(160deg); }
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .is-shaking {
      animation: shake 0.5s ease infinite;
    }

    .animate-crank {
      transform: rotate(360deg);
    }

    .animate-drop {
      animation: drop 0.7s forwards ease-in;
    }
  </style>
</head>
<body>

  <h1>今日運氣扭蛋機</h1>

  <div class="gacha-machine" id="machine">
    <div class="machine-top"></div>
    <div class="machine-globe">
      <div class="egg-display egg-1"></div>
      <div class="egg-display egg-2"></div>
      <div class="egg-display egg-3"></div>
      <div class="egg-display egg-4"></div>
      <div class="egg-display egg-5"></div>
    </div>
    <div class="machine-base">
      <div class="crank-box">
        <div class="crank-handle" id="crank"></div>
      </div>
      <div class="machine-exit">
        <div class="dropped-egg" id="droppedEgg"></div>
      </div>
    </div>
  </div>

  <button class="spin-btn" id="spinBtn">轉動扭蛋</button>

  <!-- 結果彈窗 -->
  <div class="modal-overlay" id="resultModal">
    <div class="modal-card">
      <div class="result-rank" id="rankText">大吉</div>
      <div class="result-text" id="descText">運氣滿格，想做什麼就去做，今天連路燈都會幫你亮整路。</div>
      <button class="close-btn" id="closeBtn">收下好運</button>
    </div>
  </div>

  <script>
    const fortunelist = [
      { rank: "大吉", text: "運氣滿格，想做什麼就去做，今天連路燈都會幫你亮整路。" },
      { rank: "中吉", text: "順遂順遂的，沒什麼煩心事，記得喝杯喜歡的飲料犒賞自己。" },
      { rank: "小吉", text: "藏著微小的好事，可能是準時趕上車，或是買到好吃的麵包。" },
      { rank: "吉", text: "平靜安穩的一天，沒有波折就是最好的日常。" },
      { rank: "末吉", text: "好運正在慢慢醞釀，深呼吸一下，不用急著把每件事做好。" }
    ];

    const spinBtn = document.getElementById('spinBtn');
    const machine = document.getElementById('machine');
    const crank = document.getElementById('crank');
    const droppedEgg = document.getElementById('droppedEgg');
    const resultModal = document.getElementById('resultModal');
    const closeBtn = document.getElementById('closeBtn');
    const rankText = document.getElementById('rankText');
    const descText = document.getElementById('descText');

    spinBtn.addEventListener('click', () => {
      // 禁用按鈕
      spinBtn.disabled = true;
      spinBtn.textContent = '轉動中...';

      // 旋鈕轉動與機身震動
      crank.classList.add('animate-crank');
      machine.classList.add('is-shaking');

      setTimeout(() => {
        // 停止震動並讓蛋掉落
        machine.classList.remove('is-shaking');
        droppedEgg.classList.add('animate-drop');

        setTimeout(() => {
          // 隨機選取籤詩
          const picked = fortunelist[Math.floor(Math.random() * fortunelist.length)];
          rankText.textContent = picked.rank;
          descText.textContent = picked.text;

          // 彈出結果
          resultModal.style.display = 'flex';
          spinBtn.textContent = '今日已抽取';
        }, 800);
      }, 700);
    });

    closeBtn.addEventListener('click', () => {
      resultModal.style.display = 'none';
      crank.classList.remove('animate-crank');
    });
  </script>
</body>
</html>
